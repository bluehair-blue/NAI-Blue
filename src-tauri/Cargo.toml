[package]
name = "nai-blue"
version = "1.3.4"
description = "NAI Blue desktop client for NovelAI image workflows"
authors = ["NAI Blue contributors"]
license = "GPL-3.0"
repository = "https://github.com/bluehair-blue/NAI-Blue"
edition = "2021"
rust-version = "1.88.0"
# Resolver 3 connects the declared MSRV to transitive selection, preventing
# compatible version ranges from silently locking Rust 1.91+ AWS crates.
resolver = "3"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = { version = "2.3.7", features = ["protocol-asset"] }
tauri-plugin-http = "=2.5.9"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2.5.2"
tauri-plugin-process = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
zip = "2.2"
base64 = "0.22"
sha2 = "0.10"
hmac = "=0.12.1"
time = { version = "=0.3.53", features = ["formatting"] }

# Phase 12 LAN sync shares one audited TLS/client implementation between the
# desktop listener and Android's outbound-only client. These crates provide the
# common request, certificate, pinned-rustls, and zeroization types; command
# gates in src/sync_transport.rs still prevent Android from opening a listener.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
axum-server = { version = "=0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
ipnet = "=2.12.0"
rcgen = { version = "=0.14.8", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser", "zeroize"] }
rustls = { version = "=0.23.41", default-features = false, features = ["aws_lc_rs", "std"] }
subtle = "=2.6.1"
tower = { version = "=0.5.3", default-features = false, features = ["limit"] }
zeroize = { version = "=1.9.0", features = ["derive"] }

# Tracked lifecycle/control source for Android user-initiated R2/LAN transfers.
# Its executor remains fail-closed, so registering the plugin does not enable a
# background transfer capability or add a provider SDK to desktop/mobile.
tauri-plugin-nai-blue-android-transfer = { path = "plugins/nai-blue-android-transfer" }

# Phase 09 native R2 transport. Pin to the newest AWS S3 SDK line whose
# declared MSRV matches this crate's Rust 1.88 contract. SigV4, conditional
# writes, streaming bodies, and multipart operations stay SDK-owned. The
# default HTTPS client already selects modern rustls; enabling the legacy
# `rustls` feature as well would retain the vulnerable rustls 0.21 graph.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies.aws-sdk-s3]
version = "=1.122.0"
default-features = false
features = ["default-https-client", "http-1x", "rt-tokio"]

# R2 access/secret pairs are persisted in the OS credential vault. No read
# command is exposed to the renderer; upload commands resolve references here.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies.keyring]
version = "=4.1.4"
default-features = true

# These crates back the desktop-only gates in src/lib.rs. Keeping updater here
# also prevents its reqwest rustls-no-provider feature from leaking into Android.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

# Authenticated local inbox checks Windows handles and private DACLs directly;
# this does not grant the renderer any additional filesystem scope.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

# Recommended by the official Stronghold plugin setup to keep the password KDF
# usable in development builds without changing release cryptography.
[profile.dev.package.scrypt]
opt-level = 3

[patch.crates-io]
# Tauri 2.11 still pulls plist 1.9.0, whose published crate depends on
# vulnerable quick-xml 0.39.x. The local plist copy is source-identical except
# for the quick-xml 0.41.x floor documented in vendor/plist/NAI_BLUE_PATCH.md.
plist = { path = "vendor/plist" }
